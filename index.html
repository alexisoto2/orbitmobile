<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Mobile | La red del futuro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --orbit-blue: #00d2ff;
            --orbit-purple: #9b51e0;
            --orbit-gradient: linear-gradient(135deg, #00d2ff, #9b51e0);
            --orbit-gradient-soft: linear-gradient(135deg, rgba(0, 210, 255, 0.12), rgba(155, 81, 224, 0.12));
            --orbit-dark: #070913;
            --top-navy: #0b1128;
            --gray-border: #e0e6ed;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #ffffff; color: var(--text-dark); line-height: 1.5; }

        /* Estilo unificado para figuras orbitales */
        .orbit-shape {
            background: var(--orbit-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* --- 1. BARRA SUPERIOR --- */
        .top-bar {
            background-color: var(--top-navy);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8%;
            font-size: 0.85rem;
            height: 40px;
        }

        .top-bar-left { display: flex; gap: 2px; height: 100%; }
        .tab-btn {
            padding: 0 1.2rem;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #a0a5c0;
            font-weight: 600;
            height: 100%;
        }
        .tab-btn.active {
            background-color: #172042;
            color: var(--orbit-blue);
            border-bottom: 3px solid var(--orbit-blue);
        }

        .top-bar-right { display: flex; gap: 1.5rem; align-items: center; }
        .top-bar-right a { color: #fff; text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }

        /* --- 2. HEADER PRINCIPAL --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 8%;
            border-bottom: 1px solid var(--gray-border);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.6rem; font-weight: 800; color: #0b1128; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { width: 35px; height: 35px; font-size: 1.1rem; }
        .gradient-text { background: var(--orbit-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .main-nav { display: flex; align-items: center; gap: 1.5rem; }
        .main-nav a { color: var(--text-dark); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
        
        .btn-mi-orbit {
            background: var(--orbit-gradient);
            color: #fff;
            padding: 0.5rem 1.4rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(155, 81, 224, 0.3);
        }

        /* --- 3. BANNER Y SLIDER --- */
        .hero-banner {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 20px;
        }

        .banner-wrapper {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .banner-img { width: 100%; height: auto; display: block; object-fit: cover; }
        .banner-link { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; }

        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            cursor: pointer;
            z-index: 20;
            border: 2px solid #fff;
        }

        .arrow-btn:hover { transform: translateY(-50%) scale(1.1); }
        .arrow-btn.left { left: 35px; }
        .arrow-btn.right { right: 35px; }

        .slider-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 1rem;
        }

        .dot-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--gray-border);
            background: #fff;
            color: var(--text-dark);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .dot-btn.active {
            background: var(--orbit-gradient);
            color: #fff;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 210, 255, 0.4);
        }

        /* --- 4. ACCIONES RÁPIDAS (FIGURAS IDENTICAS) --- */
        .quick-actions { padding: 4rem 8%; text-align: center; background-color: #f8fafc; }
        .quick-actions h2 { font-size: 1.8rem; margin-bottom: 2.5rem; color: #0b1128; }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .action-card {
            background: #fff;
            padding: 2.5rem 1.5rem;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid var(--gray-border);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-card .icon-circle {
            width: 70px;
            height: 70px;
            font-size: 1.6rem;
            margin-bottom: 1.2rem;
        }

        .action-card:hover {
            transform: translateY(-8px);
            border-color: var(--orbit-blue);
            box-shadow: 0 12px 25px rgba(0, 210, 255, 0.15);
        }

        .action-card:hover .icon-circle {
            transform: rotate(15deg) scale(1.05);
        }

        .action-card h3 { font-size: 1.05rem; font-weight: 700; color: #0b1128; }

        /* --- 5. VERIFICADOR DE COMPATIBILIDAD --- */
        .imei-section { padding: 4rem 8%; text-align: center; }
        .imei-container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid var(--gray-border);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            position: relative;
        }

        .imei-badge {
            width: 50px;
            height: 50px;
            margin: 0 auto 1rem auto;
            font-size: 1.3rem;
        }

        .imei-input-box { display: flex; gap: 10px; margin-top: 1.5rem; }
        .imei-input-box input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border-radius: 50px;
            border: 1px solid var(--gray-border);
            font-size: 1rem;
            outline: none;
        }
        .imei-input-box input:focus { border-color: var(--orbit-blue); }

        .btn-orbit-action {
            background: var(--orbit-gradient);
            color: #fff;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3);
            transition: transform 0.2s;
        }
        .btn-orbit-action:hover { transform: scale(1.03); }

        /* --- 6. BASE LEGAL --- */
        .legal-dropdown-section { max-width: 1200px; margin: 2rem auto 3rem auto; padding: 0 8%; }
        .legal-dropdown {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--gray-border);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            color: #0b1128;
        }

        /* --- 7. FOOTER --- */
        .site-footer { background-color: #f4f6f9; border-top: 1px solid var(--gray-border); padding-top: 3rem; }
        .footer-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 8%;
            display: grid;
            grid-template-columns: 180px repeat(4, 1fr) 260px;
            gap: 1.5rem;
        }

        .footer-logo { font-size: 1.5rem; font-weight: 800; color: #0b1128; text-decoration: none; display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
        .pill-btn { display: block; text-align: center; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.82rem; font-weight: 700; text-decoration: none; margin-bottom: 0.5rem; }
        .pill-btn.primary { background-color: #dbeafe; color: #0284c7; }
        .pill-btn.secondary { background-color: #ffffff; color: #475569; border: 1px solid #cbd5e1; }

        .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 0.9rem; }
        .footer-col ul a { color: #0072ce; text-decoration: none; font-weight: 700; font-size: 0.88rem; }

        .footer-apps h4 { font-size: 0.95rem; font-weight: 700; color: #1e293b; margin-bottom: 1rem; text-align: center; }
        .app-badges { display: flex; flex-direction: column; gap: 0.5rem; align-items: center; margin-bottom: 1.5rem; }
        .badge-btn { background-color: #000; color: #fff; width: 140px; padding: 0.4rem 0.6rem; border-radius: 8px; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 0.65rem; }

        .social-icons { display: flex; gap: 0.8rem; justify-content: center; }
        .social-icon-btn { width: 36px; height: 36px; font-size: 0.9rem; text-decoration: none; }

        .scroll-top-btn { position: fixed; bottom: 30px; right: 25px; width: 48px; height: 48px; font-size: 1.1rem; text-decoration: none; z-index: 90; }

        /* --- 8. COPYRIGHT --- */
        .footer-bottom-bar {
            background-color: #002b66;
            color: #ffffff;
            padding: 1.2rem 8%;
            font-size: 0.82rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .bottom-links a { color: #ffffff; text-decoration: none; margin-left: 1.5rem; font-weight: 600; }

        @media (max-width: 992px) {
            .footer-container { grid-template-columns: repeat(2, 1fr); }
            .footer-apps { grid-column: span 2; }
        }
    </style>
</head>
